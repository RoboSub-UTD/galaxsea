slam_toolbox:
  ros__parameters:

    use_sim_time: true
    slam_mode: mapping

    map_frame: map
    odom_frame: odom
    base_frame: wamv/wamv/base_link

    scan_topic: /wamv/sensors/lidars/lidar_wamv_sensor/scan

    resolution: 0.05
    min_laser_range: 0.2
    max_laser_range: 20.0

    minimum_travel_distance: 0.1
    minimum_travel_heading: 0.1